uk:
  process:
    title: Процес
    kicker: Робочий маршрут
    lede: Від першого звернення до передачі системи тримаємо в полі зору вихідні дані об’єкта, інженерні рішення та наступні кроки.
    journey:
      id: process
      fingerprint: 066c7944
      aria_label: Етапи роботи з електромонтажним проєктом
      assembled:
        title: Послідовність робіт для одного об’єкта
        summary: Оберіть етап, щоб побачити його зв’язок із наступною роботою.
      panel:
        assembled:
          label: Маршрут
          title: Оберіть етап
          summary: Після вибору показуємо вихідні дані, інженерне рішення та його перехід до наступної роботи.
        focus:
          label: Обраний етап
        reassembled:
          label: Наступний зв’язок
          title: Зв’язок із наступною роботою
      labels:
        input: Вихідні дані
        decision: Інженерне рішення
        next: Наступний зв’язок
      actions:
        show_relationship: Показати зв’язок
        return: Повернутися до маршруту
      media:
        image_768: /assets/images/cinematic/residence/exterior-evening-768.webp
        image_1536: /assets/images/cinematic/residence/exterior-evening-1536.webp
        image_alt: Візуальна концепція сучасної резиденції у вечірньому світлі
        image_focus: 50% 50%
      nodes:
        - id: enquiry
          title: Звернення
          input: Клієнт описує об’єкт, його стан і питання, з яким звертається.
          decision: Визначаємо, які дані потрібні для предметної розмови про електромонтажний проєкт.
          next: Питання та вихідні дані переходять до уточнення.
        - id: clarification
          title: Уточнення
          input: Зіставляємо отриманий опис із плануванням, призначенням приміщень і запланованими системами.
          decision: Формуємо перелік технічних тем, які мають вплив на склад робіт.
          next: Перелік тем задає рамку для обстеження об’єкта.
        - id: site-assessment
          title: Обстеження
          input: Оглядаємо доступні конструкції, наявні траси та обмеження об’єкта.
          decision: Визначаємо, які рішення потребують перевірки на місці та узгодження з іншими частинами об’єкта.
          next: Результати обстеження входять до проєктування і погодження.
        - id: design-and-agreement
          title: Проєктування і погодження
          input: Поєднуємо планування, сценарії використання та дані обстеження.
          decision: Узгоджуємо структуру трас, точок, захисту й взаємодію електричних систем з архітектурними рішеннями.
          next: Погоджений склад робіт стає основою для прорахунку.
        - id: estimation
          title: Прорахунок
          input: Беремо погоджений склад електротехнічних робіт і його залежності.
          decision: Розкладаємо обсяг на матеріали, етапи та вузли, які потребують координації.
          next: Робоча послідовність переходить до монтажу і пусконалагодження.
        - id: installation-and-commissioning
          title: Монтаж і пусконалагодження
          input: Виконуємо роботи за погодженою послідовністю та враховуємо зміни, що виникають на об’єкті.
          decision: Перевіряємо зв’язок між прокладеними трасами, встановленими елементами та налаштуваннями систем.
          next: Дані про конфігурацію готуються для передачі й сервісу.
        - id: handover-and-service
          title: Передача й сервіс
          input: Збираємо погоджену інформацію про склад системи та її налаштування.
          decision: Узгоджуємо, що саме передається для подальшого користування й сервісного звернення.
          next: Наступні зміни або сервісні питання розглядаємо з урахуванням цієї конфігурації.
  about:
    title: Про нас
    kicker: Інженерна робота
    lede: Розглядаємо електричну систему як частину об’єкта, його планування та щоденного використання.
    journey:
      id: about
      fingerprint: 284c693b
      aria_label: Інженерні принципи Smart Electrics
      assembled:
        title: Принципи для одного об’єкта
        summary: Оберіть принцип, щоб побачити, як він переходить у наступну роботу.
      panel:
        assembled:
          label: Принципи
          title: Оберіть принцип
          summary: Після вибору показуємо вихідні дані, інженерне рішення та його перехід до наступної роботи.
        focus:
          label: Обраний принцип
        reassembled:
          label: Наступний зв’язок
          title: Зв’язок із наступною роботою
      labels:
        input: Вихідні дані
        decision: Інженерне рішення
        next: Наступний зв’язок
      actions:
        show_relationship: Показати зв’язок
        return: Повернутися до принципів
      media:
        image_768: /assets/images/home/control-room-768.webp
        image_1536: /assets/images/home/control-room-1536.webp
        image_alt: Візуальна концепція житлового простору з багаторівневим освітленням
        image_focus: 50% 50%
      nodes:
        - id: object-context
          title: Контекст об’єкта
          input: Виходимо з планування, матеріалів, конструкцій і способу використання приміщень.
          decision: Прив’язуємо траси, точки та електричні вузли до реальної структури об’єкта.
          next: Ці прив’язки формують логіку системи.
        - id: system-logic
          title: Логіка системи
          input: Зіставляємо навантаження, групи, захист і потребу в керуванні.
          decision: Визначаємо зв’язки між живленням, освітленням, автоматизацією та іншими системами.
          next: Узгоджена логіка стає предметом координації.
        - id: coordination
          title: Координація
          input: Працюємо з архітектором і дизайнером над планами, вузлами, оздобленням та місцями для обладнання.
          decision: Фіксуємо питання, де електричні рішення залежать від суміжних робіт.
          next: Погоджена інформація готує передачу системи.
        - id: handover
          title: Передача
          input: Упорядковуємо дані про погоджений склад електричної системи та її налаштування.
          decision: Визначаємо, яку інформацію варто передати для подальшого користування й сервісного звернення.
          next: Наступні зміни розглядаємо в контексті переданої конфігурації.
    partnership:
      id: partners
      title: Для архітекторів і дизайнерів
      body: Погоджуємо вихідні дані, місця для електричних вузлів і питання, де рішення залежать від планування або оздоблення. Так електрична частина враховується разом із суміжними роботами.
  projects:
    title: Проєкти
    kicker: Підготовчий архів
    lede: Тут з’явиться архів матеріалів, коли для нього будуть підтверджені підстави.
    body:
      - Наразі ми не публікуємо тут підтверджених кейсів чи матеріалів про виконані об’єкти.
      - Візуальні концепції готових рішень залишаються прикладами конфігурацій для обговорення, а не описами робіт на конкретних об’єктах.
    links_label: Перейти до доступних матеріалів
    links:
      - label: Готові рішення
        url: /solutions/
      - label: Послуги
        url: /services/
  contact:
    title: Контакти
    kicker: Підготовча версія
    lede: На цій версії сайту звернення ще не приймаються.
    body:
      - Контактна форма не активна, а сайт не збирає контактні дані відвідувачів.
      - Адреси, телефони та інші канали зв’язку тут не оприлюднені.
    links_label: Доступні розділи
    links: []
  privacy:
    title: Конфіденційність
    kicker: Поточний технічний стан
    lede: Ця сторінка описує налаштування підготовчої версії сайту.
    body:
      - GA4 не завантажується, тому сайт не надсилає дані до Google Analytics 4.
      - Formspree не активна, контактної форми немає, а через сайт не збираються контактні дані.
      - Це поточний технічний стан, а не фінальна юридична політика конфіденційності.
    links_label: Доступні розділи
    links: []
  not_found:
    title: Сторінку не знайдено
    kicker: Помилка 404
    lede: Такої адреси немає або сторінка ще не опублікована.
    body:
      - Скористайтеся доступними розділами, щоб продовжити перегляд сайту.
    links_label: Корисні посилання
    links:
      - label: На головну
        url: /
      - label: Послуги
        url: /services/
      - label: Готові рішення
        url: /solutions/
