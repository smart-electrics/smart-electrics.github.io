      - { state: { lighting: "off", window_treatment: open }, src_768: /assets/images/cinematic/residence/room-off-open-768.webp, src_1536: /assets/images/cinematic/residence/room-off-open-1536.webp, alt: "Візуальна концепція: резиденція без увімкненого освітлення й з відкритим видом крізь скління" }
