svg:
  view_box: { width: 1536, height: 1024 }
  systems:
    - id: room
      layers:
        - id: room-ambient-light
          effect: glow
          geometry: { kind: line, x1: 620, y1: 154, x2: 1490, y2: 154 }
          binding: { control_id: lighting, type: segment, parameter: level, output: { "off": 0.04, route: 0.3, evening: 0.62, full: 0.9 } }
        - id: room-window-coverage
          effect: zone
          geometry: { kind: rect, x: 620, y: 164, width: 870, height: 516 }
          binding: { control_id: window_treatment, type: segment, parameter: coverage, output: { open: 0, tulle: 0.3, blinds: 0.52, blackout: 1, curtains: 0.74 } }
        - id: room-tulle-diffusion
          effect: tulle
          geometry: { kind: rect, x: 620, y: 164, width: 870, height: 516 }
          bindings:
            - { control_id: window_treatment, type: segment, parameter: scale, output: { open: 0, tulle: 1, blinds: 0, blackout: 0, curtains: 0 } }
            - { control_id: lighting, type: segment, parameter: level, output: { "off": 0.1, route: 0.28, evening: 0.55, full: 0.82 } }
          visible_when: { control_id: window_treatment, equals: tulle }
        - id: room-blind-slats
          effect: blind
          geometry: { kind: rect, x: 620, y: 164, width: 870, height: 516 }
          binding: { control_id: window_treatment, type: segment, parameter: angle, output: { open: 0, tulle: 0, blinds: 18, blackout: 0, curtains: 0 } }
          visible_when: { control_id: window_treatment, equals: blinds }
        - id: room-curtain-left
          effect: curtain
          geometry: { kind: polygon, points: [[1055, 164], [1055, 680], [1030, 670], [1005, 680], [980, 671], [955, 680], [930, 669], [905, 680], [880, 671], [855, 680], [855, 164]] }
          binding: { control_id: window_treatment, type: segment, parameter: translate_x, output: { open: -250, tulle: -230, blinds: -214, blackout: -160, curtains: -62 } }
          visible_when: { control_id: window_treatment, equals: curtains }
        - id: room-curtain-right
          effect: curtain
          geometry: { kind: polygon, points: [[1055, 164], [1255, 164], [1255, 680], [1230, 671], [1205, 680], [1180, 669], [1155, 680], [1130, 671], [1105, 680], [1080, 670], [1055, 680]] }
          binding: { control_id: window_treatment, type: segment, parameter: translate_x, output: { open: 250, tulle: 230, blinds: 214, blackout: 160, curtains: 62 } }
          visible_when: { control_id: window_treatment, equals: curtains }
        - id: room-roller-closure
          effect: roller
          geometry: { kind: rect, x: 620, y: 164, width: 870, height: 516 }
          binding: { control_id: window_treatment, type: segment, parameter: coverage, output: { open: 0, tulle: 0, blinds: 0, blackout: 1, curtains: 0 } }
          visible_when: { control_id: window_treatment, equals: blackout }

    - id: stairs
