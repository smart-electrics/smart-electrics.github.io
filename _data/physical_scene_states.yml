          - { id: route, label: Маршрут сходами }
          - { id: full, label: Повна циркуляція }
    initial_state: { stair_lighting: "off" }
    scenes:
      - { state: { stair_lighting: "off" }, src_768: /assets/images/cinematic/residence/stairs-off-768.webp, src_1536: /assets/images/cinematic/residence/stairs-off-1536.webp, alt: "Візуальна концепція: сходи без увімкненої підсвітки" }
