systems:
  - id: room
    scene_key: assembled
    controls:
      - id: lighting
        label: Освітлення
        choices:
          - { id: "off", label: Вимкнено }
          - { id: route, label: Маршрут }
          - { id: evening, label: Вечір }
          - { id: full, label: Повне }
      - id: window_treatment
        label: Сонцезахист
        choices:
          - { id: open, label: Відкрито }
          - { id: tulle, label: Тюль }
          - { id: blinds, label: Жалюзі }
          - { id: blackout, label: Ролети blackout }
          - { id: curtains, label: Штори }
