directions:
  - id: electrical-design
    service_slug: electrical-design
    label: Електромонтажне проєктування
    description: Логіка системи починається з узгодженого плану електромонтажних робіт.
  - id: electrical-installation
    service_slug: electrical-installation
    label: Електромонтажні роботи
    description: Траси й точки поєднують робочі частини електромонтажного проєкту.
  - id: panels-and-protection
    service_slug: panels-and-protection
    label: Щити й захист
    description: Щит об’єднує групи живлення та захист для визначених рішень.
  - id: lighting
    service_slug: lighting
    label: Освітлення
    description: Групи світла формують повсякденні й маршрутні сценарії простору.
  - id: low-voltage
    service_slug: low-voltage
    label: Слабкострумові системи
    description: Сигнальні та мультимедійні лінії підтримують зв’язки між зонами.
  - id: backup-power
    service_slug: backup-power
    label: Резервне живлення
    description: Пріоритети живлення визначають у зв’язці зі щитом і потрібними групами.
  - id: smart-home-integration
    service_slug: smart-home-integration
    label: Розумний будинок
    description: Керування об’єднує узгоджені сценарії світла, комфорту й сонцезахисту.
  - id: diagnostics-and-service
    service_slug: diagnostics-and-service
    label: Діагностика й сервіс
    description: Стан системи перевіряють у контексті наявних рішень об’єкта.
