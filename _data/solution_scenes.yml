# One physical scene per solution state. The asset base is resolved to the
# responsive <base>-{768,1536}.webp pair by the template.
apartment-comfort-and-control:
  focus_direction_id: smart-home-integration
  states:
    assembled:
      label: Простір
      title: Квартира для щоденного ритму
      summary: Світло, клімат, доступ і вибрані споживачі узгоджені з планом квартири як єдина конфігурація.
      alt: Візуальна концепція сучасної квартири з теплим багаторівневим освітленням у вечірньому інтер’єрі
      image: apartment-comfort
      image_focus: 56% 50%
    focus:
      label: Ключова система
      title: Світло й сонцезахист
      summary: Освітлення, тюль, штори й ролети мають спільну логіку керування, закладену в електричну систему квартири.
      alt: Візуальна концепція квартири з багаторівневим освітленням, тюлем, шторами та прихованими карнизами
      image: apartment-comfort-focus
      image_focus: 56% 50%
    reassembled:
      label: Сценарій простору
      title: Повернення додому
      summary: Вхідне, маршрутне й житлове світло узгоджене з положенням штор і тюлю для вечірнього повернення.
      alt: Візуальна концепція вечірнього маршруту від входу квартири до освітленої вітальні зі шторами та тюлем
      image: apartment-comfort-scenario
      image_focus: 56% 50%
private-house-full-automation:
  focus_direction_id: panels-and-protection
  states:
    assembled:
      label: Простір
      title: Будинок як цілісна система
      summary: Живлення, захист, освітлення, доступ і сценарії зібрані в одну конфігурацію приватного будинку.
      alt: Візуальна концепція приватного будинку з теплим освітленням внутрішніх і вхідних зон у синю годину
      image: private-house
      image_focus: 52% 48%
    focus:
      label: Ключова система
      title: Щит і захист
      summary: Групи живлення та захист формують зрозумілу основу для решти електричних систем будинку.
      alt: Візуальна концепція технічної зони приватного будинку з акуратно зібраним електричним щитом
      image: private-house-focus
      image_focus: 52% 48%
    reassembled:
      label: Сценарій простору
      title: Вечірній маршрут будинку
      summary: Світло вхідної зони, сходів, житлового простору й тераси вмикається послідовно вздовж вечірнього маршруту.
      alt: Візуальна концепція вечірнього маршруту приватним будинком від входу через сходи до житлової зони й тераси
      image: private-house-scenario
      image_focus: 52% 48%
architectural-lighting:
  focus_direction_id: lighting
  states:
    assembled:
      label: Простір
      title: Світло в архітектурі
      summary: Світлові точки й групи керування узгоджені з матеріалами, планом і способом користування простором.
      alt: Візуальна концепція сходів і галереї з багаторівневим архітектурним освітленням у синю годину
      image: architectural-lighting
      image_focus: 50% 50%
    focus:
      label: Ключова система
      title: Світлові групи
      summary: Групи освітлення задають потрібні акценти й підсвічують маршрут руху сходами.
      alt: Візуальна концепція архітектурного освітлення зі світловими акцентами на сходах і фактурах інтер’єру
      image: architectural-lighting-focus
      image_focus: 50% 50%
    reassembled:
      label: Сценарій простору
      title: Маршрут сходами
      summary: Маршрутне світло для сходів розглядають разом із групами освітлення та логікою руху.
      alt: Візуальна концепція вечірніх сходів із м’якою підсвіткою кожної сходинки та поручня
      image: architectural-lighting-scenario
      image_focus: 50% 50%
energy-autonomy:
  focus_direction_id: backup-power
  states:
    assembled:
      label: Простір
      title: Пріоритетні групи
      summary: Важливі споживачі, щит і резервне живлення розглядаються як одна конфігурація електричної системи.
      alt: Візуальна концепція технічної зони будинку з акуратною системою резервного живлення
      image: energy-autonomy
      image_focus: 58% 50%
    focus:
      label: Ключова система
      title: Резервне живлення
      summary: Резерв розглядають разом із групами, яким потрібна пріоритетна робота без основного живлення.
      alt: Візуальна концепція технічної зони з резервним живленням і впорядкованими кабельними трасами
      image: energy-autonomy-focus
      image_focus: 58% 50%
    reassembled:
      label: Сценарій простору
      title: Важливі групи
      summary: Вибрані групи живлення пов’язують зі щитом, захистом і потребами конкретного об’єкта.
      alt: Візуальна концепція технічної зони, поєднаної з освітленням коридору та сходів як важливими групами живлення
      image: energy-autonomy-scenario
      image_focus: 58% 50%
security-and-access-control:
  focus_direction_id: low-voltage
  states:
    assembled:
      label: Простір
      title: Вхідна зона під контролем
      summary: Доступ, мережа й спостереження узгоджені з електромонтажем та логікою освітлення входу.
      alt: Візуальна концепція безлюдної вхідної групи з теплим освітленням і дискретними точками доступу
      image: security-access
      image_focus: 52% 50%
    focus:
      label: Ключова система
      title: Слабкострумова інфраструктура
      summary: Траси для мережі, доступу й спостереження планують разом із простором та електромонтажем.
      alt: Візуальна концепція вхідної зони з дискретно інтегрованими точками мережі, доступу та відеоконтролю
      image: security-access-focus
      image_focus: 52% 50%
    reassembled:
      label: Сценарій простору
      title: Контроль входу
      summary: Точки відеоконтролю узгоджують із доступом, трасами та потрібними зонами об’єкта.
      alt: Візуальна концепція вечірнього входу приватного будинку з освітленою зоною доступу та камерою спостереження
      image: security-access-scenario
      image_focus: 52% 50%
commercial-space:
  focus_direction_id: lighting
  states:
    assembled:
      label: Простір
      title: Світло для робочих зон
      summary: Електричні групи, освітлення, клімат і доступ узгоджені з призначенням комерційного простору.
      alt: Візуальна концепція безлюдного комерційного простору із зональним теплим освітленням у вечірній час
      image: commercial-space
      image_focus: 50% 48%
    focus:
      label: Ключова система
      title: Зональне освітлення
      summary: Освітлення робочих зон пов’язане з їхнім призначенням, графіком та електричною структурою простору.
      alt: Візуальна концепція комерційного простору з окремими світловими зонами над робочими поверхнями
      image: commercial-space-focus
      image_focus: 50% 48%
    reassembled:
      label: Сценарій простору
      title: Вечірній перехід
      summary: Після завершення роботи основні групи приглушуються, а вхід, прохід і рецепція зберігають орієнтувальне світло.
      alt: Візуальна концепція комерційного простору після завершення роботи з приглушеними треками та орієнтувальним світлом
      image: commercial-space-scenario
      image_focus: 50% 48%
