    - { title: Події та команди, description: Описуємо умови запуску та потрібну дію для кожної системи. }
    - { title: Пріоритети живлення, description: Розподіляємо групи, яким потрібна окрема увага в електромонтажному проєкті. }
    - { title: Налаштування й перевірка, description: Після монтажу перевіряємо сценарій і залишаємо можливість ручного керування. }
