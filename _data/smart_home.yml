formation:
  kicker: Інженерний підхід
  title: Як формується сценарій автоматизації
  description: Сценарій визначають планування та спосіб користування простором, а не перелік обладнання.
  steps:
    - { title: Потреби простору, description: Збираємо щоденні дії, критичні зони та моменти, коли потрібна допомога системи. }
