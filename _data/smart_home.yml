hero:
  kicker: Автоматизація без прив’язки до бренду
  title: Розумний будинок
  description: Сценарії поєднують світло, клімат, доступ, безпеку й живлення відповідно до планування та щоденного користування простором.
  disclosure: Це демонстрація логіки, а не керування обладнанням. Для кожного електромонтажного проєкту сценарій налаштовують окремо.
  scene_alt: Тепло освітлена вітальня з багаторівневим світлом і зонами комфорту
  scene_caption: Сцена показує подію, інженерну логіку та зміни в об’єкті.
simulator:
  kicker: Панель керування простором
  title: Один простір, дев’ять систем
  description: Оберіть конфігурацію для адаптації та вручну уточніть логіку кожної системи.
  legend: Оберіть готову конфігурацію
  scene_label: Схема обраної системи в просторі
  active_connection_label: Активна система
  logic_kicker: Логіка конфігурації
  route_label: Маршрут у просторі
  controls_label: Системи панелі керування
  related_aria_prefix: Пов’язані послуги й рішення для конфігурації
  selected_system_prefix: Обрано систему
spatial:
  zones:
    - { id: entry, label: Вхід, x: 14, y: 72 }
    - { id: passage, label: Прохід, x: 35, y: 58 }
    - { id: living, label: Вітальня, x: 63, y: 54 }
    - { id: private, label: Приватна зона, x: 77, y: 27 }
    - { id: technical, label: Технічна зона, x: 27, y: 25 }
    - { id: stairs, label: Сходи, x: 48, y: 29 }
    - { id: exterior, label: Двір, x: 90, y: 73 }
  systems:
    - id: lighting
      label: Освітлення
      x: 26
      y: 33
      side: left
      visual: lighting
      summary: Рівні світла, маршрутні точки й акценти визначають за планом простору.
      topology: { label: Логіка світла, detail: Групи й точки керування об’єднують у послідовність для конкретної зони. }
      controls:
        - { id: brightness, type: range, label: Рівень світла, output_label: Яскравість, output_suffix: "%", min: 0, max: 100, step: 1 }
        - { id: layer, type: segment, label: Активна група, output_label: Група світла, options: [{ id: route, label: Маршрут }, { id: evening, label: Вечір }, { id: full, label: Усі групи }] }
    - id: climate
      label: Клімат-контроль
      x: 84
      y: 23
      side: right
      visual: climate
      summary: Опалення, охолодження й вентиляцію розглядають разом із зонами перебування.
      topology: { label: Логіка комфорту, detail: Схему клімату узгоджують із потребами конкретної зони. }
      controls:
        - id: comfort
          type: segment
          label: Стан комфорту
          output_label: Обраний стан
          options: [{ id: warm, label: Тепліше }, { id: balanced, label: Збалансовано }, { id: cool, label: Прохолодніше }]
        - { id: operation, type: segment, label: Намір системи, output_label: Намір, options: [{ id: auto, label: Автоматично }, { id: heating, label: Обігрів }, { id: cooling, label: Охолодження }] }
    - id: access
      label: Доступ
      x: 2
      y: 49
      side: left
      visual: access
      summary: Події входу й правила доступу узгоджують із маршрутом і межами конкретного об’єкта.
      topology:
        label: Логіка входу
        detail: Подію доступу пов’язують із потрібною дією без дистанційного керування точкою входу.
      controls:
        - { id: arrival_route, type: toggle, label: Підготувати маршрут входу, output_label: Маршрут входу, on_label: Маршрут підготовлено, off_label: Маршрут без підготовки }
        - { id: entry_zone, type: segment, label: Точка маршруту, output_label: Обрана точка, options: [{ id: gate, label: Хвіртка }, { id: entry, label: Вхід }, { id: garage, label: Гараж }] }
    - id: security
      label: Безпека й відео
      x: 83
      y: 44
      side: right
      visual: security
      summary: Для зон відеоконтролю й технічних сигналів визначають окремі межі та реакції.
      topology:
        label: Логіка контролю
        detail: Обраний контур визначає, які точки враховують у проєктній логіці.
      controls:
        - id: coverage
          type: segment
          label: Контур контролю
          output_label: Обраний контур
          options: [{ id: entry, label: Вхід }, { id: perimeter, label: Периметр }, { id: quiet, label: Тихий контур }]
        - { id: event_path, type: segment, label: Технічний шлях, output_label: Обраний шлях, options: [{ id: video, label: Відео }, { id: sensors, label: Сигнали }, { id: quiet, label: Тихий контур }] }
    - id: panel
      label: Щит і захист
      x: 4
      y: 72
      side: left
      visual: panel
      summary: Групи живлення й захисту задають електричну схему для узгодженої роботи систем.
      topology:
        label: Логіка щита
        detail: Розподіл, захист і пріоритети розглядають як одну електричну схему.
      diagnostics:
        observation: Обрана ділянка електричної схеми
        isolation: Ізоляція шару схеми
        next_step: Наступна інженерна перевірка
      controls:
        - id: layer
          type: segment
          label: Шар схеми
          output_label: Обраний шар
          options: [{ id: protection, label: Захист }, { id: groups, label: Групи }, { id: priorities, label: Пріоритети }]
        - { id: priority_groups, type: toggle, label: Врахувати пріоритетні групи, output_label: Пріоритетні групи, on_label: Пріоритетні групи враховано, off_label: Без окремих пріоритетів }
    - id: low-voltage
      label: Слабкострумна інфраструктура
      x: 23
      y: 84
      side: left
      visual: low-voltage
      summary: Лінії зв’язку й точки керування проєктують там, де вони потрібні для сценаріїв.
      topology:
        label: Логіка слабкоструму
        detail: Окремий маршрут поєднує точки керування з мережею або технічними сигналами.
      diagnostics:
        observation: Обрана лінія або точка
        isolation: Ізоляція маршруту
        next_step: Наступна інженерна перевірка
      controls:
        - id: route
          type: segment
          label: Шлях інфраструктури
          output_label: Обраний шлях
          options: [{ id: network, label: Мережа }, { id: video, label: Відео }, { id: signals, label: Сигнали }]
        - { id: topology_focus, type: segment, label: Фокус схеми, output_label: Фокус схеми, options: [{ id: routes, label: Траси }, { id: points, label: Точки }, { id: interfaces, label: Зв’язки }] }
    - id: backup-power
      label: Резервне живлення
      x: 78
      y: 72
      side: right
      visual: backup-power
      summary: Пріоритетні споживачі та межі резерву узгоджують зі щитом і захистом.
      topology: { label: Логіка резерву, detail: Пріоритетні групи визначають у схемі конкретного електромонтажного проєкту. }
      controls:
        - { id: priority_groups, type: toggle, label: Врахувати пріоритетні групи, output_label: Пріоритетні групи, on_label: Пріоритетні групи враховано, off_label: Без окремих пріоритетів }
        - { id: restore_intent, type: segment, label: Порядок відновлення, output_label: Послідовність, options: [{ id: essential, label: Критичні групи }, { id: staged, label: Поетапно }, { id: manual, label: Вручну }] }
    - id: audio
      label: Аудіо
      x: 64
      y: 84
      side: right
      visual: audio
      summary: Аудіо враховують у сценарії лише для зон, де воно потрібне.
      topology:
        label: Логіка аудіо
        detail: Джерело спрямовують до обраної зони та групи; ця панель не відтворює аудіо.
      controls:
        - { id: source, type: segment, label: Джерело сигналу, output_label: Обране джерело, options: [{ id: local, label: Локальний вхід }, { id: media, label: Медіацентр }, { id: scenario, label: Сценарій }] }
        - { id: zone, type: segment, label: Зона аудіо, output_label: Обрана зона, options: [{ id: living, label: Вітальня }, { id: terrace, label: Тераса }, { id: private, label: Приватна зона }] }
        - { id: group, type: segment, label: Група аудіо, output_label: Обрана група, options: [{ id: single, label: Одна зона }, { id: shared, label: Суміжні зони }, { id: floor, label: Увесь поверх }] }
        - { id: muted, type: toggle, label: Приглушити або відновити звук, output_label: Стан аудіо, on_label: Звук приглушено, off_label: Звук відновлено }
    - id: shading
      label: Сонцезахист
      x: 48
      y: 12
      side: center
      visual: shading
      summary: Штори, тюль і ролети пов’язують зі світлом, приватністю й сонячним навантаженням.
      topology: { label: Логіка сонцезахисту, detail: "Для кожної зони визначають положення, яке можна скоригувати вручну." }
      controls:
        - { id: position, type: range, label: Положення сонцезахисту, output_label: Відкриття, output_suffix: "%", min: 0, max: 100, step: 1 }
        - { id: treatment, type: segment, label: Тип сонцезахисту, output_label: Обраний тип, options: [{ id: tulle, label: Тюль }, { id: blinds, label: Жалюзі }, { id: curtains, label: Штори }, { id: rollers, label: Ролети }] }
  visuals:
    - { id: lighting, desktop: /assets/images/home/control-room-1536.webp, mobile: /assets/images/home/control-room-768.webp, alt: Тепло освітлена сучасна вітальня з природними матеріалами ввечері }
    - { id: climate, desktop: /assets/images/smart-home/climate-1536.webp, mobile: /assets/images/smart-home/climate-768.webp, alt: Житлова зона з інтегрованими системами клімату у вечірньому світлі }
    - { id: access, desktop: /assets/images/smart-home/exterior-1536.webp, mobile: /assets/images/smart-home/exterior-768.webp, alt: Вечірній фасад сучасного будинку з освітленою доріжкою та входом }
    - { id: security, desktop: /assets/images/smart-home/surveillance-1536.webp, mobile: /assets/images/smart-home/surveillance-768.webp, alt: Вхідна зона сучасного будинку з точками відеоконтролю }
    - { id: panel, desktop: /assets/images/smart-home/panel-1536.webp, mobile: /assets/images/smart-home/panel-768.webp, alt: Електричний щит у технічній зоні будинку }
    - { id: low-voltage, desktop: /assets/images/smart-home/electrical-installation-1536.webp, mobile: /assets/images/smart-home/electrical-installation-768.webp, alt: Підготовлені електричні та слабкострумні траси в технічній зоні об’єкта }
    - { id: backup-power, desktop: /assets/images/smart-home/backup-1536.webp, mobile: /assets/images/smart-home/backup-768.webp, alt: Технічна зона з місцем для резервного живлення й пріоритетних груп }
    - { id: audio, desktop: /assets/images/smart-home/audio-1536.webp, mobile: /assets/images/smart-home/audio-768.webp, alt: Житлова зона з інтегрованими аудіоточками та теплим вечірнім світлом }
    - { id: shading, desktop: /assets/images/smart-home/shading-1536.webp, mobile: /assets/images/smart-home/shading-768.webp, alt: Сучасна вітальня з опущеними шторами та м’яким вечірнім світлом }
