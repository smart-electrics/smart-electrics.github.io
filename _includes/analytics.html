{% if site.integrations.google_analytics.enabled %}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.integrations.google_analytics.measurement_id | escape }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ site.integrations.google_analytics.measurement_id | escape }}', { anonymize_ip: true });
  </script>
{% endif %}
