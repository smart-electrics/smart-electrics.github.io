<!doctype html>
<html lang="{{ page.lang | default: site.lang }}">
  <head>
    {% include head.html %}
  </head>
  <body class="layout-{{ page.layout | default: 'default' }}{% if page.url == '/' %} home-page{% endif %}">
    <a class="skip-link" href="#main-content">До основного вмісту</a>
    <div class="ambient" aria-hidden="true">
      <span class="ambient__glow ambient__glow--one"></span>
      <span class="ambient__glow ambient__glow--two"></span>
      <span class="ambient__grid"></span>
    </div>
    {% include header.html %}
    <main id="main-content">
      {{ content }}
    </main>
    {% include footer.html %}
    {% if page.layout == 'landing' or page.services_catalogue %}
      <script type="module" src="{{ '/assets/js/cinematic-stage.js' | relative_url }}"></script>
      <script type="module" src="{{ '/assets/js/physical-scene-controls.js' | relative_url }}"></script>
    {% endif %}
    {% if page.url == '/smart-home/' %}
      <script type="module" src="{{ '/assets/js/smart-home-simulator.js' | relative_url }}"></script>
    {% endif %}
  </body>
</html>
